plugins { id 'com.android.application' }
android {
    namespace 'kz.arena.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'kz.arena.mobile'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '1.3.2'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('ARENA_KEYSTORE')) {
                storeFile file(System.getenv('ARENA_KEYSTORE'))
                storePassword System.getenv('ARENA_STORE_PASSWORD')
                keyAlias System.getenv('ARENA_KEY_ALIAS')
                keyPassword System.getenv('ARENA_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('ARENA_KEYSTORE')) signingConfig signingConfigs.release } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
